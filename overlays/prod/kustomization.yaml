apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
images:
  - name: nginx
    newTag: 1.27-alpine
replicas:
  - name: webapp
    count: 3
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: webapp-config
      data:
        APP_ENV: "production"
