apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dev
resources:
  - ../../base
  - migration-job.yaml
images:
  - name: nginx
    newTag: 1.25-alpine
replicas:
  - name: webapp
    count: 1
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: webapp-config
        annotations:
          argocd.argoproj.io/sync-wave: "0"
      data:
        APP_ENV: "development"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: webapp
        annotations:
          argocd.argoproj.io/sync-wave: "2"
